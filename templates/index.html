<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>F1 Telemetry Monitor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { font-family: monospace; background: #1e1e1e; color: #00ff00; padding: 20px; }
        .status { margin-bottom: 20px; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .packet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
        .packet-card { background: #333; padding: 10px; border-radius: 5px; }
        .packet-id { font-weight: bold; color: #fff; }
        .packet-val { font-size: 0.9em; color: #aaa; word-break: break-all; }
        .highlight { color: #ffff00; }
    </style>
</head>
<body>
    <div class="status">
        <h1>Moniteur Télémétrie F1 23</h1>
        <p>Statut SocketIO: <span id="connection-status" style="color: red;">Déconnecté</span></p>
    </div>

    <div id="packet-container" class="packet-grid">
        </div>

    <script>
        const socket = io();

        socket.on('connect', () => {
            document.getElementById('connection-status').innerText = "Connecté";
            document.getElementById('connection-status').style.color = "green";
        });

        socket.on('disconnect', () => {
            document.getElementById('connection-status').innerText = "Déconnecté";
            document.getElementById('connection-status').style.color = "red";
        });

        // On écoute tous les paquets possibles (0 à 12 pour F1 23)
        for (let i = 0; i <= 12; i++) {
            socket.on(`packet_${i}`, (data) => {
                updatePacketDisplay(i, data);
            });
        }

        function updatePacketDisplay(id, data) {
            let card = document.getElementById(`pkt-${id}`);
            
            // Si la carte n'existe pas, on la crée
            if (!card) {
                const container = document.getElementById('packet-container');
                card = document.createElement('div');
                card.id = `pkt-${id}`;
                card.className = 'packet-card';
                card.innerHTML = `<div class="packet-id">Packet ID: ${id}</div><div class="packet-val" id="val-${id}">Wait...</div>`;
                container.appendChild(card);
            }

            // Mise à jour visuelle simple (affiche la taille des données ou un champ clé)
            const valDiv = document.getElementById(`val-${id}`);
            // On affiche juste un JSON stringifié court pour vérifier la réception
            valDiv.innerText = JSON.stringify(data).substring(0, 50) + "...";
            
            // Petit effet visuel pour montrer l'activité
            card.style.border = "1px solid #ffff00";
            setTimeout(() => { card.style.border = "none"; }, 100);
        }
    </script>
</body>
</html>
